name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and system
      placeholder: "0.1.0, Windows 11, Node 22"
    validations:
      required: true
